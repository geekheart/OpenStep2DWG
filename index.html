<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenStep2DWG · 工程图工作台</title><meta name="theme-color" content="#f7f9fa"><meta name="description" content="纯前端 STEP 转 DWG 工程图工作台。精确投影、A4 排版与本地导出。"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header"><a href="./" class="brand"><span class="brand-mark">◇</span><span>Open<span class="brand-light">Step2DWG</span><small>工程图工作台</small></span></a><div class="header-actions"><span class="local-badge"><i></i>本地处理</span><button id="open-project">打开项目</button><button id="save-project">保存项目</button><button id="export" class="primary">↓ 导出图纸</button></div></header>
<div class="document-bar"><div class="document-title"><span>▧</span><input id="project-name" aria-label="项目名称" maxlength="120"><span class="badge">STEP → DWG</span></div><div class="document-meta"><span id="entity-total"></span><span>A4 · 297 × 210 mm</span><span id="save-state">示例已载入</span></div></div>
<main class="workspace">
<aside class="sidebar">
<nav class="tabs" aria-label="编辑面板"><button class="active" data-tab="source">模型与视图</button><button data-tab="drawing">图纸设置</button></nav>
<div id="panel-source" class="panel active">
<section><h2>STEP 模型</h2><button class="upload-card" id="import-step"><span class="upload-symbol">↥</span><strong id="source-name">导入 STEP 文件</strong><small id="source-info">.step / .stp</small></button><div class="source-actions"><button class="text-button" id="load-demo">载入示例</button><a href="assets/demo.step" download="DEMO-BOARD.step">下载示例 STEP ↗</a></div></section>
<section><h2>投影设置</h2><label>视图组合<select id="view-layout"><option value="inspection">正面 / 背面 / 前侧</option><option value="first-angle">第一角法 · 正面 / 前侧 / 左侧</option></select></label><label class="field-label">模型旋转</label><div class="segmented" aria-label="模型旋转"><button data-rotation="0" class="selected">0°</button><button data-rotation="90">90°</button><button data-rotation="180">180°</button><button data-rotation="270">270°</button></div><label>细节<select id="detail"><option value="full">完整几何</option><option value="mechanical">简化板面薄层</option></select></label><button id="convert" class="primary full" disabled>生成工程图</button><div id="progress-card" hidden><div class="progress-heading"><span id="progress-label" role="status">准备转换</span><button id="cancel" class="text-button">取消</button></div><progress id="progress" max="100" value="0"></progress><span id="elapsed"></span></div><p class="inline-error" id="conversion-error" role="alert" hidden></p></section>
<section><div class="section-heading"><h2>图纸视图</h2><button id="reset-layout" class="text-button">自动排版</button></div><div id="view-list"></div><div class="field-row"><label>位置 X <span>mm</span><input id="view-x" type="number" step="0.5"></label><label>位置 Y <span>mm</span><input id="view-y" type="number" step="0.5"></label></div><button id="align-views" class="full">对齐正面与前侧</button></section>
</div>
<div id="panel-drawing" class="panel">
<section><h2>纸张与比例</h2><label>纸张<select disabled aria-label="纸张"><option>A4 · 横向 · 297 × 210 mm</option></select></label><label class="toggle"><span>自动适配比例</span><input id="auto-scale" type="checkbox" checked></label><label>绘图比例<input id="drawing-scale" type="number" min="0.000001" max="1000000" step="0.1"></label><label class="toggle"><span>外形尺寸标注</span><input id="dimensions" type="checkbox" checked></label><label class="toggle"><span>图框与标题栏</span><input id="frame" type="checkbox" checked></label><label>轮廓线宽<select id="line-width"><option value="0.13">0.13 mm</option><option value="0.18" selected>0.18 mm</option><option value="0.25">0.25 mm</option><option value="0.35">0.35 mm</option></select></label></section>
<section><h2>标题栏</h2><label>图号<input id="drawing-number" maxlength="120"></label><div class="field-row"><label>版本<input id="revision" maxlength="20"></label><label>日期<input id="drawing-date" type="date"></label></div></section>
<section><h2>模型信息</h2><dl id="model-info"></dl></section>
</div>
</aside>
<section class="preview-area" aria-label="工程图预览"><div class="preview-toolbar"><span class="preview-label"><i></i>A4 工程图<span id="scale-label"></span></span><div class="preview-tools"><button id="undo" title="撤销 (Ctrl/⌘ Z)" aria-label="撤销">↶</button><button id="redo" title="重做" aria-label="重做">↷</button><span class="divider"></span><button id="fit">适应画布</button><button id="actual">100%</button></div></div><div class="viewport" id="viewport"><div id="paper"></div><div class="drop-overlay" id="drop-overlay">释放 STEP 文件，生成工程图</div><div id="loading" class="loading" hidden>载入图纸…</div></div><div class="preview-bottom"><label class="snap"><input id="snap" type="checkbox" checked>毫米吸附</label><span id="selection-label">正面视图</span><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button></div></div></section>
</main>
<dialog id="export-dialog" aria-labelledby="export-title"><div class="dialog-heading"><h2 id="export-title">导出图纸</h2><button id="close-export" aria-label="关闭导出">×</button></div><div class="export-body"><div class="export-preview"><img id="export-preview" alt="导出工程图预览"></div><div class="export-controls"><label>文件格式<select id="export-format"><option value="dwg">DWG · AutoCAD 2000</option><option value="dxf">DXF · AutoCAD 2000</option><option value="svg">SVG · 矢量图</option><option value="png">PNG · 图片</option></select></label><label id="dpi-row" hidden>图片分辨率<select id="export-dpi"><option value="150">150 DPI</option><option value="300" selected>300 DPI</option><option value="600">600 DPI</option></select></label><dl><dt>纸张</dt><dd>A4 横向</dd><dt>单位</dt><dd>mm</dd><dt>比例</dt><dd id="export-scale"></dd></dl><p id="export-info" role="status"></p><p id="export-error" class="inline-error" role="alert" hidden></p></div></div><div class="dialog-footer"><span id="export-filename"></span><button id="save-as">另存为…</button><button id="download-export" class="primary">下载文件</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div><input type="file" id="step-file" accept=".step,.stp" hidden><input type="file" id="project-file" accept=".json" hidden><script type="module" src="app.js"></script>
</body></html>
