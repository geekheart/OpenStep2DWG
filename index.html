<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="page.title">OpenStep2DWG · 工程图工作台</title><meta name="theme-color" content="#f7f9fa"><meta name="description" content="纯前端 STEP 转 DWG 工程图工作台。精确投影、A4 排版与本地导出。"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header"><a href="./" class="brand"><span class="brand-mark">◇</span><span>Open<span class="brand-light">Step2DWG</span></span></a><div class="header-actions"><select id="language-select" aria-label="界面语言" data-i18n-aria-label="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select><a id="github-link" class="icon-link" href="https://github.com/geekheart/OpenStep2DWG" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看源代码（新标签页）" data-i18n-aria-label="github" title="在 GitHub 查看源代码（新标签页）" data-i18n-title="github"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.63 1.23 3.27.94.1-.73.4-1.23.72-1.51-2.5-.29-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.99 0 0 .95-.3 3.09 1.15a10.78 10.78 0 0 1 5.62 0c2.14-1.45 3.09-1.15 3.09-1.15.61 1.56.23 2.71.11 2.99.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.41.35.76 1.03.76 2.08v3.11c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"/></svg></a><button id="open-project" data-i18n="openProject">打开项目</button><button id="save-project" data-i18n="saveProject">保存项目</button><button id="export" class="primary" data-i18n="exportButton">↓ 导出图纸</button></div></header>
<div class="document-bar"><div class="document-title"><span>▧</span><input id="project-name" aria-label="项目名称" data-i18n-aria-label="projectName" maxlength="120"></div><div class="document-meta"><span id="entity-total"></span><span>A4 · 297 × 210 mm</span><span id="save-state">示例已载入</span></div></div>
<main class="workspace">
<aside class="sidebar">
<nav class="tabs" aria-label="编辑面板" data-i18n-aria-label="editorPanels"><button class="active" data-tab="source" data-i18n="modelViews">模型与视图</button><button data-tab="drawing" data-i18n="drawingSettings">图纸设置</button></nav>
<div id="panel-source" class="panel active">
<section><h2 data-i18n="stepModel">STEP 模型</h2><button class="import-card" id="import-step"><span class="import-symbol">▱</span><strong id="source-name">选择本地 STEP 文件</strong><small id="source-info">.step / .stp</small></button><div class="source-actions"><button class="text-button" id="load-demo" data-i18n="loadDemo">载入示例</button><a href="assets/demo.step" download="DEMO-BOARD.step" data-i18n="downloadDemo">下载示例 STEP ↗</a></div></section>
<section><h2 data-i18n="projectionSettings">投影设置</h2><label><span data-i18n="viewLayout">视图组合</span><select id="view-layout"><option value="inspection" data-i18n="inspection">正面 / 背面 / 前侧</option><option value="first-angle" data-i18n="firstAngle">第一角法 · 正面 / 前侧 / 左侧</option></select></label><label class="field-label" data-i18n="modelRotation">模型旋转</label><div class="segmented" aria-label="模型旋转" data-i18n-aria-label="modelRotation"><button data-rotation="0" class="selected">0°</button><button data-rotation="90">90°</button><button data-rotation="180">180°</button><button data-rotation="270">270°</button></div><label><span data-i18n="detail">细节</span><select id="detail"><option value="full" data-i18n="fullGeometry">完整几何</option><option value="mechanical" data-i18n="simplifyThin">简化板面薄层</option></select></label><button id="convert" class="primary full" disabled data-i18n="generateDrawing">生成工程图</button><div id="progress-card" hidden><div class="progress-heading"><span id="progress-label" role="status">准备转换</span><button id="cancel" class="text-button" data-i18n="cancel">取消</button></div><progress id="progress" max="100" value="0"></progress><span id="elapsed"></span></div><p class="inline-error" id="conversion-error" role="alert" hidden></p></section>
<section><div class="section-heading"><h2 data-i18n="drawingViews">图纸视图</h2><button id="reset-layout" class="text-button" data-i18n="autoLayout">自动排版</button></div><div id="view-list"></div><div class="field-row"><label><span data-i18n="positionX">位置 X</span><span>mm</span><input id="view-x" type="number" step="0.5"></label><label><span data-i18n="positionY">位置 Y</span><span>mm</span><input id="view-y" type="number" step="0.5"></label></div><button id="align-views" class="full" data-i18n="alignViews">对齐正面与前侧</button></section>
</div>
<div id="panel-drawing" class="panel">
<section><h2 data-i18n="paperScale">纸张与比例</h2><label><span data-i18n="paper">纸张</span><select disabled aria-label="纸张" data-i18n-aria-label="paper"><option data-i18n="a4LandscapeSize">A4 · 横向 · 297 × 210 mm</option></select></label><label class="toggle"><span data-i18n="autoScale">自动适配比例</span><input id="auto-scale" type="checkbox" checked></label><label><span data-i18n="drawingScale">绘图比例</span><input id="drawing-scale" type="number" min="0.000001" max="1000000" step="0.1"></label><label class="toggle"><span data-i18n="dimensions">外形尺寸标注</span><input id="dimensions" type="checkbox" checked></label><label class="toggle"><span data-i18n="frameTitle">图框与标题栏</span><input id="frame" type="checkbox" checked></label><label><span data-i18n="lineWidth">轮廓线宽</span><select id="line-width"><option value="0.13">0.13 mm</option><option value="0.18" selected>0.18 mm</option><option value="0.25">0.25 mm</option><option value="0.35">0.35 mm</option></select></label></section>
<section><h2 data-i18n="titleBlock">标题栏</h2><label><span data-i18n="drawingNumber">图号</span><input id="drawing-number" maxlength="120"></label><div class="field-row"><label><span data-i18n="revision">版本</span><input id="revision" maxlength="20"></label><label><span data-i18n="date">日期</span><input id="drawing-date" type="date"></label></div></section>
<section><h2 data-i18n="modelInfo">模型信息</h2><dl id="model-info"></dl></section>
</div>
</aside>
<section class="preview-area" aria-label="工程图预览" data-i18n-aria-label="drawingPreview"><div class="preview-toolbar"><span class="preview-label"><i></i><span data-i18n="a4Drawing">A4 工程图</span><span id="scale-label"></span></span><div class="preview-tools"><button id="undo" title="撤销 (Ctrl/⌘ Z)" data-i18n-title="undoTitle" aria-label="撤销" data-i18n-aria-label="undo">↶</button><button id="redo" title="重做" data-i18n-title="redo" aria-label="重做" data-i18n-aria-label="redo">↷</button><span class="divider"></span><button id="fit" data-i18n="fitCanvas">适应画布</button><button id="actual">100%</button></div></div><div class="viewport" id="viewport"><div id="paper"></div><div class="drop-overlay" id="drop-overlay" data-i18n="dropStep">释放 STEP 文件，生成工程图</div><div id="loading" class="loading" hidden data-i18n="loadingDrawing">载入图纸…</div></div><div class="preview-bottom"><label class="snap"><input id="snap" type="checkbox" checked><span data-i18n="snap">毫米吸附</span></label><span id="selection-label">正面视图</span><div class="zoom"><button id="zoom-out" aria-label="缩小" data-i18n-aria-label="zoomOut">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大" data-i18n-aria-label="zoomIn">＋</button></div></div></section>
</main>
<dialog id="export-dialog" aria-labelledby="export-title"><div class="dialog-heading"><h2 id="export-title" data-i18n="exportDrawing">导出图纸</h2><button id="close-export" aria-label="关闭导出" data-i18n-aria-label="closeExport">×</button></div><div class="export-body"><div class="export-preview"><img id="export-preview" alt="导出工程图预览" data-i18n-alt="exportPreview"></div><div class="export-controls"><label><span data-i18n="format">文件格式</span><select id="export-format"><option value="dwg">DWG · AutoCAD 2000</option><option value="dxf">DXF · AutoCAD 2000</option><option value="svg" data-i18n="svgFormat">SVG · 矢量图</option><option value="png" data-i18n="pngFormat">PNG · 图片</option></select></label><label id="dpi-row" hidden><span data-i18n="resolution">图片分辨率</span><select id="export-dpi"><option value="150">150 DPI</option><option value="300" selected>300 DPI</option><option value="600">600 DPI</option></select></label><dl><dt data-i18n="paper">纸张</dt><dd data-i18n="landscape">A4 横向</dd><dt data-i18n="units">单位</dt><dd>mm</dd><dt data-i18n="scale">比例</dt><dd id="export-scale"></dd></dl><p id="export-info" role="status"></p><p id="export-error" class="inline-error" role="alert" hidden></p></div></div><div class="dialog-footer"><span id="export-filename"></span><button id="save-as" data-i18n="saveAs">另存为…</button><button id="download-export" class="primary" data-i18n="download">下载文件</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div><input type="file" id="step-file" accept=".step,.stp" hidden><input type="file" id="project-file" accept=".json" hidden><script type="module" src="app.js"></script>
</body></html>
